</header>
<main class="exam-content lookup-only">
  <div class="top-actions single-action">
    <a class="action-link" href="index.html"><i class="fas fa-home"></i>返回學生專區首頁</a>
  </div>
  <section class="search-panel lookup-panel">
    <label class="search-label" for="studentSearch"><i class="fas fa-magnifying-glass" style="color: var(--ipe-gold); margin-right: 8px;"></i>輸入姓名查詢</label>
    <div class="lookup-row">
      <input class="search-input" id="studentSearch" placeholder="請輸入完整姓名" type="search" autocomplete="off"/>
      <button class="lookup-btn" id="lookupBtn" type="button"><i class="fas fa-search"></i>查詢</button>
    </div>
    <p class="lookup-hint">為保護學員資訊，請盡量輸入完整姓名。查詢結果只會顯示符合姓名的學生。</p>
    <div class="empty-result" id="emptyResult">查無符合資料，請確認姓名是否輸入正確。</div>
    <div class="lookup-results" id="lookupResults"></div>
  </section>
  <div class="notice-card"><strong>提醒：</strong>查到自己的組別後，請點選「查看我的考試流程」。流程頁只會顯示該組開始與結束時間。</div>

const input = document.getElementById('studentSearch');
const btn = document.getElementById('lookupBtn');
const results = document.getElementById('lookupResults');
const empty = document.getElementById('emptyResult');
function tagClass(subject) {
  if(subject.includes('皮膚')) return 'skin';
  if(subject.includes('美體')) return 'body';
  if(subject.includes('熱蠟')) return 'wax';
  return '';
}
function runLookup() {
  const q = input.value.trim();
  results.innerHTML = '';
  empty.style.display = 'none';
  if(!q) {
    empty.textContent = '請先輸入姓名。';
    empty.style.display = 'block';
    return;
  }
  const exact = students.filter(s => s.name === q);
  let matches = exact.length ? exact : (q.length >= 2 ? students.filter(s => s.name.includes(q)) : []);
  if(!matches.length) {
    empty.textContent = q.length < 2 ? '請至少輸入兩個字，或直接輸入完整姓名。' : '查無符合資料，請確認姓名是否輸入正確。';
    empty.style.display = 'block';
    return;
  }
  results.innerHTML = matches.map(s => `
    <article class="student-card public-result-card">
      <div class="student-head">
        <h3 class="student-name">${s.name}</h3>
        <span class="student-number">${s.groupText}</span>
      </div>
      <div class="tags">${s.subjects.map(sub => `<span class="tag ${tagClass(sub)}">${sub}</span>`).join('')}</div>
      <a class="schedule-jump" href="exam-schedule-619.html?group=${encodeURIComponent(s.group)}&name=${encodeURIComponent(s.name)}"><i class="fas fa-calendar-alt"></i> 查看我的考試流程</a>
    </article>
  `).join('');
}
btn.addEventListener('click', runLookup);
input.addEventListener('keydown', e => { if(e.key === 'Enter') runLookup(); });
